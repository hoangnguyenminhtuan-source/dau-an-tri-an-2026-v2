<style>

.hl{position:relative;padding-left:clamp(0px,11vw,170px)}
.hero h1{font-family:"Dancing Script","Great Vibes",cursive;color:var(--red);font-weight:700;font-size:clamp(54px,8.5vw,118px);line-height:.92;transform:rotate(-5deg);transform-origin:left;text-shadow:0 3px 0 #fff,0 10px 22px rgba(163,18,31,.25)}

.bq{position:absolute;left:1vw;bottom:8px;width:270px;height:250px}

.sl p{font-family:"Playfair Display",serif;font-style:italic;font-size:clamp(18px,2.6vw,36px);margin-top:14px}

#sx{opacity:0;transition:opacity .3s;z-index:2}#ss:hover #sx{opacity:1}@media(hover:none){#sx{opacity:.7}}

.sr{position:absolute;left:-9999px}
.hi{display:block;width:100%;margin-top:-28px;aspect-ratio:1344/320;object-fit:cover;object-position:35% 50%}
.ci{margin-top:-4px;position:relative}
.ci img{width:100%;aspect-ratio:100/98;object-fit:cover;border-radius:22px;display:block;box-shadow:var(--sh)}
.ci a{display:block;transition:transform .2s}.ci a:hover{transform:translateY(-4px)}
.qc{position:relative}
.qrw{position:absolute;left:29.6%;top:30%;width:46%;aspect-ratio:1;background:#fff;padding:3.5%;border-radius:6px}

.qt{display:none}
.wall .mid{column-span:all}.grid .mid{grid-column:1/-1}
@media(max-width:760px){.qi{display:none}.qt{display:flex}.hi{aspect-ratio:auto;height:230px}.hr{display:none}.hero{display:block;padding:36px 5vw 150px}.hl{padding-left:0}.bq{transform:scale(.7);transform-origin:left bottom}header{flex-wrap:wrap;padding:8px 12px}nav{order:3;width:100%}.cta{display:none}.fab{display:block}.hero{padding-bottom:90px}.brand{font-size:11px}}
@media(prefers-reduced-motion:reduce){.sl{animation:none}}
</style>

<script>
/* ============ CẤU HÌNH – CHỈ CẦN SỬA PHẦN NÀY ============
 SHEETS: link CSV của tab "Đã duyệt" trong từng Google Sheet
         (Tệp → Chia sẻ → Phát hành lên web → chọn tab → định dạng CSV).
         Để trống = hiện dữ liệu mẫu.
 FORMS : {
  wish:"https://forms.gle/hkYJEps2T989PYVb7",   // Form 1: Lời chúc
  photo:"https://forms.gle/m1H5biECmLwKZ1kJ7",  // Form 2: Khoảnh khắc (ảnh)
  video:"https://forms.gle/YVq6177F1rHwvUbG6"   // Form 3: Video TikTok
},.
 LOCAL_VIDEOS: video đã tải về, bỏ vào thư mục /videos, ví dụ
         [{title:"Tên video",author:"Tên đội",src:"videos/a.mp4"}] – chạy tự động, chạy được khi mạng yếu. */
const CONFIG={
  SHEETS:{wish:"https://docs.google.com/spreadsheets/d/e/2PACX-1vQHlkkilkn_hsPEydhsIuAKp0Sg9haSaUuHEzsYJUj0_DP8NJ70YlJ7tlxyzsA5HycCKdAS5Cdpb-F2/pub?gid=1973938239&single=true&output=csv",photo:"https://docs.google.com/spreadsheets/d/e/2PACX-1vQPbspkSQikGDZoEhUqzAoqWYtXw5GOJhjhjhOEAwiMtM1BkGJP5emS4XtocLk_rpSAUlzAor17a5hJ/pub?gid=2117287501&single=true&output=csv",video:"https://docs.google.com/spreadsheets/d/e/2PACX-1vRvgIKTjWIqhv9DCNqZv7j1LuqlfcFeW2Eu3rApAvVPJ4fWIAU4P2-vwmeKXgbQrvAKOer-ZHVUKLsz/pub?gid=1495999635&single=true&output=csv"},
  FORMS:{wish:"https://forms.gle/hkYJEps2T989PYVb7",photo:"https://forms.gle/m1H5biECmLwKZ1kJ7",video:"https://forms.gle/YVq6177F1rHwvUbG6"},
  LOGO:"logo-doan.png",            // ví dụ "logo.png" (đặt cùng thư mục)
  HERO_IMG:"logo-truong.png",        // ví dụ "hero.jpg"
  LOCAL_VIDEOS:[],
  ADDRESS:"Cơ sở chính: Số 594 Lê Duẩn, Phường Ea Kao, Tỉnh Đắk Lắk <br> Cơ sở số 2: Số 276 Trường Chinh, Phường Tuy Hòa, Tỉnh Đắk Lắk <br> Cơ sở số 3: Thôn Xuân Dục, Phường Bình Kiến, Tỉnh Đắk Lắk <br> Cơ sở 4: Số 30 Y Ngông, Phường Buôn Ma Thuột, Tỉnh Đắk Lắk",
  SOCIAL:{fb:"https://www.facebook.com/doantruongcddaklak",yt:"",tt:"",<br> td:"https://web-thi-dua-xi.vercel.app/"},
  QUOTE:"Tháng 11 không chỉ là mùa tri ân, mà còn là dịp để chúng ta nhìn lại, trân trọng và tiếp thêm động lực trên hành trình trưởng thành.",
  SLOGAN:"Tri ân hôm nay – Vững bước ngày mai"
};
/* ======================================================== */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MAP={
  wish:{name:"họ và tên",lop:"lớp",khoa:"khoa",text:"lời chúc",to:"gửi tới",st:"trạng thái",pr:"ưu tiên"},
  photo:{name:"họ và tên",lop:"lớp",khoa:"khoa",file:"tải ảnh",cap:"chú thích",st:"trạng thái",pr:"ưu tiên"},
  video:{name:"họ và tên",lop:"lớp",khoa:"khoa",title:"tên video",url:"link",st:"trạng thái",pr:"ưu tiên"}
};
const DEMO={wish:[["Cảm ơn thầy cô đã luôn bên em!","Nguyễn Minh Anh","51C.CNTT","Công nghệ thông tin - Kế toán"],["Thầy cô là động lực của chúng em ♡","Trần Gia Bảo","52C.THUY","Nông - Lâm - Thú y - Thủy sản"],["Chúc thầy cô luôn mạnh khỏe, hạnh phúc!","Lê Thu Hà","51C.CBMA","Du lịch-Thời trang"],["Em biết ơn từng bài giảng và từng lời nhắc nhở của thầy cô.","Phạm Quốc Huy","51C.CNOT","Công nghệ ô tô"],["Tri ân người lái đò thầm lặng.","Võ Ngọc Lan","50T.KTXD","Cơ - Điện - Xây dựng"]].map(([text,name,lop,khoa])=>({text,name,lop,khoa,to:""})),photo:[],video:[]};
let D,demo=false,loadErr=false;
const SF=`<svg style="display:none"><symbol id="sf" viewBox="-50 -50 100 100">${[...Array(14)].map((_,i)=>`<ellipse cx="0" cy="-30" rx="9" ry="19" transform="rotate(${i*360/14})" fill="${i%2?"#f9c52b":"#f3a90c"}"/>`).join("")}<circle r="19" fill="#6b3a12"/><circle r="12" fill="#4a2508"/></symbol></svg>`;

function csv(t){const r=[];let w=[],c="",q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==","){w.push(c);c=""}else if(h=="\n"){w.push(c);r.push(w);w=[];c=""}else if(h!="\r")c+=h}if(c||w.length){w.push(c);r.push(w)}return r}
function parse(t,m){const r=csv(t),h=r.shift().map(x=>x.normalize("NFC").toLowerCase()),ix={};for(const k in m)ix[k]=h.findIndex(x=>x.includes(m[k]));
  return r.filter(x=>x.some(Boolean)&&(ix.st<0||/^đã duyệt$/i.test((x[ix.st]||"").normalize("NFC").trim()))).map(x=>{const o={};for(const k in ix)o[k]=ix[k]<0?"":(x[ix[k]]||"").trim();return o}).sort((a,b)=>(+a.pr||1e9)-(+b.pr||1e9))}
async function get(u){const c=new AbortController();setTimeout(()=>c.abort(),8000);const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return r.text()}
const gid=u=>(u.match(/[?&]id=([\w-]+)/)||u.match(/\/d\/([\w-]+)/)||[])[1];
const thumb=u=>{const i=gid(u||"");return i?`https://drive.google.com/thumbnail?id=${i}&sz=w1600`:(u||"")};
const vid=u=>(String(u).match(/video\/(\d+)/)||[])[1];
const yt=u=>(String(u).match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{11})/)||[])[1];
const emb=u=>vid(u)?`https://www.tiktok.com/embed/v2/${vid(u)}`:yt(u)?`https://www.youtube.com/embed/${yt(u)}?rel=0`:"";

async function load(frozen){
  const fz=localStorage.getItem("tn_frozen");if(frozen&&fz)return JSON.parse(fz);
  const U=CONFIG.SHEETS;if(!U.wish&&!U.photo&&!U.video){demo=true;return DEMO}
  try{
    const [w,p,v]=await Promise.all(["wish","photo","video"].map(k=>U[k]?get(U[k]).then(t=>parse(t,MAP[k])):[]));
    const d={wish:w.filter(x=>x.text),photo:p.map(o=>({...o,img:thumb((o.file||"").split(",")[0].trim())})).filter(o=>o.img),video:v.filter(o=>o.url)};
    localStorage.setItem("tn_cache",JSON.stringify(d));return d;
  }catch(e){loadErr=true;const c=localStorage.getItem("tn_cache");return c?JSON.parse(c):{wish:[],photo:[],video:[]}}
}

const note=(w,i)=>`<div class="note n${i%5}" style="transform:rotate(${(i*37)%7-3}deg)">${esc(w.text)}${w.to?`<small>Gửi ${esc(w.to)}</small>`:""}<b>${esc(w.name)} · ${esc(w.lop)}${w.khoa?" · "+esc(w.khoa):""}</b></div>`;
const empty=t=>`<p class="mid">${loadErr?"⚠ Không đọc được dữ liệu từ Google Sheet. Thêm #kiemtra vào cuối địa chỉ để xem lý do.":t}</p>`;
const V={},M={};

V.home=d=>`${loadErr?'<p class="demo">Không đọc được dữ liệu từ Google Sheet. Thêm #kiemtra vào cuối địa chỉ để xem lý do.</p>':""}${demo?'<p class="demo">Đang hiển thị dữ liệu mẫu – hãy điền link Google Sheet vào phần CONFIG.</p>':""}
<h1 class="sr">Tháng 11 – Lời Tri Ân</h1>
<img class="hi" src="assets/hero.jpg" alt="Tháng 11 Lời Tri Ân – Nơi những yêu thương được lưu giữ">
<section class="cards ci">
<a href="#send"><img src="assets/card-wall.jpg" alt="Bức tường tri ân – Gửi lời nhắn ngay"></a>
<a href="#photos"><img src="assets/card-photo.jpg" alt="Khoảnh khắc tháng 11 – Xem album"></a>
<a href="#videos"><img src="assets/card-video.jpg" alt="Góc video – Xem video"></a>
<div class="qc"><img src="assets/card-qr.jpg" alt="Cùng lan tỏa lời tri ân – Quét QR để tham gia ngay"><div class="qrw"><div id="qr"></div></div></div>
</section>
<img class="qi" src="assets/quote.jpg" alt="${esc(CONFIG.QUOTE)}">
<div class="qt"><span>🌺</span><p>“${esc(CONFIG.QUOTE)}”</p><span>📖</span></div>`;
M.home=()=>{if(window.QRCode)new QRCode($("#qr"),{text:location.href.split("#")[0]+"#send",width:128,height:128,colorDark:"#7a0b16"})};

V.wall=d=>{const ks=[...new Set(d.wish.map(w=>w.khoa).filter(Boolean))];
  return `<div class="bar"><button class="chip on" data-k="">Tất cả</button>${ks.map(k=>`<button class="chip" data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div><div class="wall" id="wl"></div><div class="mid"><button class="btn" id="more">Xem thêm</button></div>`};
M.wall=d=>{let k="",n=24;const L=$("#wl"),B=$("#more"),C=document.querySelectorAll(".chip");
  const draw=()=>{const a=d.wish.filter(w=>!k||w.khoa==k);L.innerHTML=a.slice(0,n).map(note).join("")||empty("Chưa có lời chúc nào. Hãy là người đầu tiên gửi lời tri ân!");B.hidden=n>=a.length};
  C.forEach(c=>c.onclick=()=>{k=c.dataset.k;n=24;C.forEach(x=>x.classList.toggle("on",x==c));draw()});B.onclick=()=>{n+=24;draw()};draw()};

V.photos=d=>`<div class="wall">${d.photo.map((p,i)=>`<figure class="pol" data-i="${i}"><img loading="lazy" src="${esc(p.img)}" alt="">${esc(p.cap||"")}<b>${esc(p.name)} · ${esc(p.lop)}</b></figure>`).join("")||empty("Chưa có ảnh nào. Hãy chia sẻ khoảnh khắc của bạn!")}</div>`;
M.photos=d=>document.querySelectorAll(".pol").forEach(e=>e.onclick=()=>{const p=d.photo[e.dataset.i];openBox(`<div><img src="${esc(p.img)}" alt=""><p style="margin-top:10px">${esc(p.cap||"")} — ${esc(p.name)}</p></div>`)});

V.videos=d=>`<div class="grid">${d.video.map((v,i)=>`<button class="vid" data-i="${i}"><span>▶</span>${esc(v.title||"Video tri ân")}<small>${esc(v.name)} · ${esc(v.lop)}</small></button>`).join("")||empty("Chưa có video nào. Hãy nộp video dự thi của bạn!")}</div>`;
M.videos=d=>document.querySelectorAll(".vid").forEach(e=>e.onclick=()=>{const v=d.video[e.dataset.i],id=emb(v.url),Y=/youtube/.test(id);
  id?openBox(`<iframe src="${id}" allow="autoplay;fullscreen" allowfullscreen style="${Y?"width:min(900px,94vw);aspect-ratio:16/9":"width:min(340px,92vw);height:min(80vh,640px)"};border:0;border-radius:14px;background:#fff"></iframe>`):window.open(v.url,"_blank")});

V.send=()=>`<section class="mid" style="padding:44px 0"><h2 class="ttl">Gửi lời tri ân</h2><p>Chọn cách bạn muốn gửi yêu thương đến thầy cô</p><div class="cards" style="margin-top:26px">${[["wish","💌","Gửi lời nhắn","Viết vài dòng cho thầy cô (không cần đăng nhập)"],["photo","📸","Gửi khoảnh khắc","Chia sẻ ảnh kỷ niệm (cần đăng nhập Google)"],["video","▶","Nộp video TikTok","Dán link video dự thi"]].map(([k,e,t,s])=>`<a class="card" target="_blank" rel="noopener" href="${esc(CONFIG.FORMS[k]||"#send")}"><span class="pill">${e} ${t}</span><small>${s}</small></a>`).join("")}</div></section>`;

V["trinh-chieu"]=()=>`<section class="mid" style="padding:50px 5vw"><h2 class="ttl">Trình chiếu Tọa đàm 20/11</h2><p>Trước giờ G, khi còn mạng: bấm “Chốt dữ liệu &amp; tải sẵn”. Sau đó bấm “Bắt đầu”.</p><p style="margin:18px 0"><button class="btn" id="fz">Chốt dữ liệu &amp; tải sẵn</button><button class="btn" id="go">▶ Bắt đầu trình chiếu</button></p><p id="fs"></p><small>Phím: Space tạm dừng · ← → chuyển slide · Esc thoát</small></section>`;
M["trinh-chieu"]=()=>{$("#fz").onclick=e=>freeze(e.target);$("#go").onclick=play;if(localStorage.getItem("tn_frozen"))$("#fs").textContent="Đã có bản dữ liệu chốt – trình chiếu sẽ dùng bản này (bấm chốt lại nếu có nội dung mới)."};

V.kiemtra=()=>`<section class="mid" style="padding:30px 5vw;text-align:left;max-width:820px;margin:auto"><h2 class="ttl">Kiểm tra kết nối</h2><pre id="dg" style="white-space:pre-wrap;font:14px/1.6 monospace">Đang kiểm tra…</pre></section>`;
M.kiemtra=async()=>{const o=[];for(const k of["wish","photo","video"]){const u=CONFIG.SHEETS[k];o.push("== "+k+" ==");if(!u){o.push("Chưa điền link SHEETS."+k);continue}
  try{const t=await get(u);if(/<html/i.test(t.slice(0,300))){o.push("⚠ Link trả về trang HTML, không phải CSV. Đuôi link phải là output=csv");continue}
   const r=csv(t),h=(r[0]||[]).map(x=>x.normalize("NFC").toLowerCase());o.push("Đọc được. Số dòng (cả tiêu đề): "+r.length);o.push("Cột: "+(r[0]||[]).join(" | "));
   for(const f in MAP[k])o.push("  "+f+" ← \""+MAP[k][f]+"\": "+(h.findIndex(x=>x.includes(MAP[k][f]))<0?"KHÔNG THẤY CỘT":"ok"));
   o.push("Số dòng sẽ hiển thị (đã duyệt): "+parse(t,MAP[k]).length)}catch(e){o.push("LỖI không tải được: "+e+" → kiểm tra link CSV, hoặc chạy bằng localhost/Vercel thay vì mở file trực tiếp")}}
  $("#dg").textContent=o.join("\n")};
function openBox(h){const b=$("#box");b.innerHTML=`<button class="x" aria-label="Đóng">✕</button>${h}`;b.hidden=false}
$("#box").onclick=e=>{if(e.target.id=="box"||e.target.className=="x"){e.currentTarget.hidden=true;e.currentTarget.innerHTML=""}};

async function freeze(btn){
  btn.textContent="Đang chốt…";const d=await load(false);localStorage.setItem("tn_frozen",JSON.stringify(d));
  const u=d.photo.map(p=>p.img),total=u.length+CONFIG.LOCAL_VIDEOS.length;let n=0;
  const tick=()=>{btn.textContent=`Đang tải sẵn ${++n}/${total}`};
  await Promise.all([...u.map(x=>new Promise(r=>{const i=new Image();i.onload=i.onerror=()=>{tick();r()};i.src=x})),...CONFIG.LOCAL_VIDEOS.map(v=>fetch(v.src).catch(()=>0).then(tick))]);
  btn.textContent=`✔ Đã chốt ${d.wish.length} lời chúc, ${u.length} ảnh, ${d.video.length+CONFIG.LOCAL_VIDEOS.length} video`;
}

async function play(){
  const o=$("#ss");o.hidden=false;$("#sl").innerHTML="<p>Đang tải…</p>";o.requestFullscreen?.().catch(()=>{});
  const d=await load(true),A=[d.wish,d.photo,d.video.concat(CONFIG.LOCAL_VIDEOS.map(v=>({...v,loc:1})))];
  const S=[{k:-1}].concat(A.flatMap((a,k)=>a.map((x,i)=>({p:(i+.5)/a.length,k,x}))).sort((a,b)=>a.p-b.p));
  let i=0,t,paused=false;
  const next=(s=1)=>{clearTimeout(t);i=(i+s+S.length)%S.length;show()};
  window.nx=()=>next();
  function show(){const {k,x}=S[i];let h,ms=9000;
    if(k<0){h="<h2>Tháng 11<br>Lời Tri Ân</h2><p>Tri ân thầy cô nhân ngày Nhà giáo Việt Nam 20/11</p>";ms=7000}
    else if(k==0){h=note(x,i);ms=Math.min(20000,7000+x.text.length*90)}
    else if(k==1){h=`<img src="${esc(x.img)}" alt=""><p class="cp">${esc(x.cap||"")}<b>${esc(x.name)} · ${esc(x.lop)}</b></p>`;ms=8000}
    else if(x.loc){h=`<video src="${esc(x.src)}" autoplay playsinline onended="nx()" style="max-height:72vh;max-width:88vw"></video><p>${esc(x.title)} · ${esc(x.author)}</p>`;ms=120000}
    else{const id=emb(x.url),Y=/youtube/.test(id);h=id?`<iframe src="${id}${Y?"&autoplay=1":""}" allow="autoplay;fullscreen" style="${Y?"width:min(88vw,107vh);aspect-ratio:16/9":"width:min(340px,90vw);height:72vh"};border:0;border-radius:14px"></iframe><p>${esc(x.title)} · ${esc(x.name)}</p>`:`<h2 style="font-size:clamp(36px,6vw,80px)">${esc(x.title)}</h2><p>${esc(x.name)} · Video TikTok</p>`;ms=45000}
    $("#sl").innerHTML=h;if(!paused)t=setTimeout(()=>next(),ms)}
  function stop(){clearTimeout(t);o.onclick=null;o.hidden=true;$("#sl").innerHTML="";removeEventListener("keydown",key);document.removeEventListener("fullscreenchange",fsc);document.fullscreenElement&&document.exitFullscreen()}
  function key(e){if(e.key==" "){e.preventDefault();paused=!paused;paused?clearTimeout(t):next()}else if(e.key=="ArrowRight")next(1);else if(e.key=="ArrowLeft")next(-1);else if(e.key=="Escape")stop()}
  function fsc(){if(!document.fullscreenElement)stop()}
  addEventListener("keydown",key);document.addEventListener("fullscreenchange",fsc);o.onclick=e=>{if(!e.target.closest("iframe,video,button"))next(e.clientX>innerWidth/2?1:-1)};$("#sx").onclick=e=>{e.stopPropagation();stop()};show();
}

async function route(){
  const r=(location.hash||"#home").slice(1),v=V[r]?r:"home";
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.hash=="#"+v));
  if(!D)$("#app").innerHTML=empty("Đang tải…");
  D=D||await load(false);
  $("#app").innerHTML=V[v](D);(M[v]||(()=>{}))(D);scrollTo(0,0);
}
addEventListener("DOMContentLoaded",()=>{
  document.body.insertAdjacentHTML("afterbegin",SF);
  if(CONFIG.LOGO){$("#lg").style.backgroundImage=`url(${CONFIG.LOGO})`;$("#lg").textContent=""}
  $("#pl").onclick=e=>{e.preventDefault();play()};$("#ad").innerHTML=CONFIG.ADDRESS;$("#sg").textContent=CONFIG.SLOGAN;
  $("#so").innerHTML=[["fb","Facebook"],["yt","YouTube"],["tt","TikTok"],["td","Quản lý thi đua"]].filter(([k])=>CONFIG.SOCIAL[k]).map(([k,n])=>`<a href="${esc(CONFIG.SOCIAL[k])}" target="_blank" rel="noopener">${n}</a>`).join("");
  route();
});
addEventListener("hashchange",route);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
